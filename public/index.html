<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 1.1rem;
        }
        
        .content {
            padding: 40px;
        }
        
        .operation {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 4px solid #3498db;
        }
        
        .operation h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px dashed #bdc3c7;
            border-radius: 5px;
            background: white;
            font-size: 14px;
        }
        
        input[type="file"]:hover {
            border-color: #3498db;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        button {
            background: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PDF Editor</h1>
            <p>Delete pages, combine PDFs, and extract pages with ease</p>
        </div>
        
        <div class="content">
            <!-- Delete Pages -->
            <div class="operation">
            <h3>Delete Pages</h3>
            <input type="file" id="deleteFile" accept=".pdf" />
            <input type="text" id="pagesToDelete" placeholder="Pages to delete (e.g., 1,3,5)" />
            <button onclick="deletePages()">Delete Pages</button>
            </div>
            
            <!-- Combine PDFs -->
            <div class="operation">
                <h3>Combine PDFs</h3>
                <input type="file" id="combineFiles" accept=".pdf" multiple />
                <button onclick="combinePDFs()">Combine PDFs</button>
            </div>
            
            <!-- Extract Pages -->
            <div class="operation">
                <h3>Extract Pages</h3>
                <input type="file" id="extractFile" accept=".pdf" />
                <input type="text" id="pagesToExtract" placeholder="Pages to extract (e.g., 1,3,5)" />
                <button onclick="extractPages()">Extract Pages</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
